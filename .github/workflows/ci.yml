name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável: a suíte test:db apaga e recria a cada execução
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viveiro_test

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Varredura de segredos
        run: node scripts/scan-secrets.mjs --all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes contra Postgres real
        run: npm run test:db
