name: CI

on:
  pull_request:
  push:
    branches: [master, main]

jobs:
  verificar:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      # Banco descartável: a suíte test:db apaga e recria a cada execução
      TEST_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/viveiro_test

    steps:
      # Ação fixada pelo SHA do commit: a tag se move, o SHA não (SEC-007)
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          # O commitlint lê todos os commits do pull request, e não só o último
          fetch-depth: 0

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # RNF-22: o hook commit-msg é local e se pula; aqui não. Merge é ignorado
      # pelo commitlint, e no push confere o último commit
      - name: Mensagens de commit
        if: github.event_name == 'pull_request'
        run: npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose

      - name: Mensagem do último commit
        if: github.event_name == 'push'
        run: npx commitlint --last --verbose

      - name: Varredura de segredos
        run: node scripts/scan-secrets.mjs --all

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck

      - name: Testes unitários
        run: npm test

      - name: Testes contra Postgres real
        run: npm run test:db
