# T10.1 (RNF-13, E6): cópia diária do banco de produção, guardada FORA do Neon.
#
# Roda às 03:00 de Brasília e também à mão (aba Actions > Backup > Run workflow).
# A cópia sai cifrada antes de virar artefato: o repositório é público, e o
# artefato de repositório público pode ser baixado por qualquer conta logada.
# Retenção: 30 dias; a cópia do dia 1º fica 90 dias (o máximo do GitHub), e é
# a mensal que o E6 §3.1 pede fora do provedor.
#
# Segredos (Settings > Secrets and variables > Actions):
#   BACKUP_DATABASE_URL  URL do Neon SEM "-pooler" no host (o pg_dump precisa da conexão direta)
#   BACKUP_PASSPHRASE    frase de 20+ caracteres; sem ela a cópia não se abre, guarde fora do GitHub
#
# O agendamento só roda a partir da branch padrão (master), e o GitHub o
# desliga depois de 60 dias sem commit no repositório: um commit reativa.

name: Backup

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      BACKUP_DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
      BACKUP_PASSPHRASE: ${{ secrets.BACKUP_PASSPHRASE }}

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Conferir os segredos
        run: |
          test -n "$BACKUP_DATABASE_URL" || { echo "Falta o segredo BACKUP_DATABASE_URL"; exit 1; }
          test -n "$BACKUP_PASSPHRASE" || { echo "Falta o segredo BACKUP_PASSPHRASE"; exit 1; }

      # pg_dump da mesma versão do Neon (17), pela imagem oficial: o do Ubuntu é mais velho e recusa
      - name: Copiar o banco
        run: |
          set -euo pipefail
          mkdir -p copia
          docker run --rm -e BACKUP_DATABASE_URL -v "$PWD/copia:/copia" postgres:17 \
            sh -c 'pg_dump --format=custom --no-owner --no-privileges --file=/copia/viveiro.dump "$BACKUP_DATABASE_URL" && chmod 644 /copia/viveiro.dump'
          # A cópia que o pg_restore não lê não é cópia: falha aqui, e não no dia da restauração
          docker run --rm -v "$PWD/copia:/copia" postgres:17 pg_restore --list /copia/viveiro.dump > /dev/null
          echo "Cópia de $(du -h copia/viveiro.dump | cut -f1)"

      - name: Cifrar
        id: cifrar
        run: |
          set -euo pipefail
          DATA=$(TZ=America/Sao_Paulo date +%Y-%m-%d)
          npx tsx scripts/cifra-backup.ts cifrar copia/viveiro.dump "copia/viveiro-$DATA.dump.cifrado"
          sudo rm copia/viveiro.dump
          echo "nome=viveiro-$DATA" >> "$GITHUB_OUTPUT"
          if [ "$(TZ=America/Sao_Paulo date +%d)" = "01" ]; then echo "dias=90" >> "$GITHUB_OUTPUT"; else echo "dias=30" >> "$GITHUB_OUTPUT"; fi

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: ${{ steps.cifrar.outputs.nome }}
          path: copia/*.cifrado
          retention-days: ${{ steps.cifrar.outputs.dias }}
          if-no-files-found: error
          compression-level: 0

      # E5 §2.3: registro de acesso com mais de 12 meses e sessão expirada saem
      - name: Aplicar a retenção
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: npx tsx scripts/manutencao.ts retencao

      # RN-21 / E4 A-09: lote cujo saldo não é a soma dos movimentos falha o workflow, e a falha chega por e-mail
      - name: Conferir o saldo dos lotes
        env:
          DATABASE_URL: ${{ secrets.BACKUP_DATABASE_URL }}
        run: npx tsx scripts/manutencao.ts conferir --so-saldo
